spring.application.name=springbootcrudresponseentitiy
server.port=9999

#view Resolver
#spring.web.error.whitelabel.enabled=false
#spring.mvc.view.prefix=/WEB-INF/view/
#spring.mvc.view.suffix=.jsp

#database

spring.datasource.url=jdbc:mysql://localhost:3306/springboot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=local
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# HIBERNATE / JPA CONFIG
# ===============================

# Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Show SQL in console
spring.jpa.show-sql=true

# Update tables automatically
spring.jpa.hibernate.ddl-auto=update

# Format the SQL output
spring.jpa.properties.hibernate.format_sql=true
