spring.application.name=AuthProject

server.port=8080
logging.level.org.springframework.web=DEBUG
# Database Configuration

spring.datasource.url=jdbc:mysql://localhost:3306/016_25batch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=local
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform


#Multipart Configuration // File uploading 
spring.servlet.encoding.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.max-request-size=200MB